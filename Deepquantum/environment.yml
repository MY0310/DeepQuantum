# Conda environment configuration for Q-GAD system
# Usage: conda env create -f environment.yml
# Update: conda env update -f environment.yml --prune

name: qgad
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python
  - python=3.10.20

  # Core scientific computing
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.3.3

  # PyTorch (CUDA 12.x build)
  - pytorch=2.10.0
  - torchvision=0.26.0

  # Machine Learning
  - scikit-learn=1.7.2
  - xgboost=3.2.0
  - lightgbm=4.6.0

  # Graph processing
  - networkx=3.4.2

  # Visualization
  - matplotlib=3.8.4
  - seaborn=0.13.2

  # Utilities
  - tqdm=4.67.3
  - joblib=1.5.3
  - pyyaml=6.0.3
  - requests=2.33.1

  # Development tools
  - jupyter
  - ipykernel=7.2.0
  - pip>=23.0

  # Pip-only packages
  - pip:
      # Quantum computing framework (GBS kernel)
      - deepquantum==4.5.0

      # Experiment tracking & visualization
      - wandb==0.25.1
      - plotly==6.7.0
