# Conda environment configuration for Q-GAD system
# Usage: conda env create -f environment.yml
# Update: conda env update -f environment.yml

name: qgad
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python version
  - python=3.10.20

  # Core scientific computing
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.3.3

  # PyTorch (qgad baseline: GPU build, CUDA 12.x)
  - pytorch=2.10.0
  - torchvision=0.26.0

  # Machine Learning
  - scikit-learn=1.7.2
  - xgboost=3.2.0
  - lightgbm=4.6.0

  # Graph processing
  - networkx=3.4.2

  # Visualization
  - matplotlib=3.8.4
  - seaborn=0.13.2

  # Utilities
  - tqdm=4.67.3
  - joblib=1.5.3
  - pyyaml=6.0.3
  - requests=2.33.1

  # Development tools
  - jupyter
  - ipykernel=7.2.0
  - pip>=23.0

  # Pip packages (not available on conda)
  - pip:
      # DeepQuantum (install from source or PyPI if available)
      - git+https://github.com/turingq/deepquantum.git

      # Additional utilities
      - wandb==0.25.1  # For experiment tracking (optional)
      - plotly==6.7.0  # For interactive plots
