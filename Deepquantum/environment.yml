# Conda environment configuration for Q-GAD system
# Usage: conda env create -f environment.yml
# Update: conda env update -f environment.yml

name: qgad
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core scientific computing
  - numpy=1.26.*
  - scipy>=1.10.0
  - pandas>=2.0.0

  # PyTorch (CPU version - modify for CUDA if needed)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - cpuonly  # Remove this line if you have CUDA GPU

  # Machine Learning
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0
  - lightgbm>=4.0.0

  # Graph processing
  - networkx>=3.1

  # Visualization
  - matplotlib=3.8.*
  - seaborn>=0.12.0

  # Utilities
  - tqdm>=4.65.0
  - joblib>=1.3.0
  - pyyaml>=6.0
  - requests>=2.31.0

  # Development tools
  - jupyter>=1.0.0
  - ipykernel>=6.25.0
  - pip>=23.0

  # Pip packages (not available on conda)
  - pip:
      # DeepQuantum (install from source or PyPI if available)
      - git+https://github.com/turingq/deepquantum.git

      # Additional utilities
      - wandb>=0.15.0  # For experiment tracking (optional)
      - plotly>=5.18.0  # For interactive plots
